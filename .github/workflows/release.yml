name: Release

# 推 v* tag 時在 Windows 上打包，並建立草稿 release(確認沒問題再手動發佈)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CRA 在 CI=true 時會把 eslint warning 當成錯誤
      - run: npm run make-both
        env:
          CI: false

      - name: Rename zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem out/make -Recurse -Filter *.zip | Select-Object -First 1
          Copy-Item $zip.FullName "lol-app-win32-x64-${{ github.ref_name }}.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} lol-app-win32-x64-${{ github.ref_name }}.zip --draft --title ${{ github.ref_name }} --notes "draft"
